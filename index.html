    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        /* Animazioni per le scritte nello sfondo */
        @keyframes floatText {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(0deg);
            }
            10% {
                opacity: 0.15;
            }
            50% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.15;
            }
            100% {
                opacity: 0;
                transform: translate(100px, -100px) rotate(10deg);
            }
        }

        @keyframes floatText2 {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(0deg);
            }
            10% {
                opacity: 0.1;
            }
            50% {
                opacity: 0.25;
            }
            90% {
                opacity: 0.1;
            }
            100% {
                opacity: 0;
                transform: translate(-80px, 80px) rotate(-8deg);
            }
        }

        @keyframes floatText3 {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            10% {
                opacity: 0.2;
            }
            50% {
                opacity: 0.35;
                transform: translate(50px, 50px) scale(1.2) rotate(5deg);
            }
            90% {
                opacity: 0.2;
            }
            100% {
                opacity: 0;
                transform: translate(100px, 100px) scale(1) rotate(10deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(1.05);
            }
        }

        .bg-text {
            position: fixed;
            font-size: 15vw;
            font-weight: 900;
            color: #ec4899;
            pointer-events: none;
            user-select: none;
            z-index: 0;
            white-space: nowrap;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .bg-text-1 {
            top: 10%;
            left: -5%;
            animation: floatText 20s ease-in-out infinite;
            opacity: 0;
        }

        .bg-text-2 {
            top: 40%;
            right: -5%;
            animation: floatText2 25s ease-in-out infinite 3s;
            opacity: 0;
        }

        .bg-text-3 {
            top: 70%;
            left: 10%;
            animation: floatText3 22s ease-in-out infinite 6s;
            opacity: 0;
        }

        .bg-text-4 {
            top: 25%;
            left: 30%;
            animation: pulse 15s ease-in-out infinite 2s;
            opacity: 0.1;
        }

        .bg-text-5 {
            top: 55%;
            right: 20%;
            animation: floatText 28s ease-in-out infinite 8s;
            opacity: 0;
        }

        .bg-text-6 {
            top: 85%;
            right: 40%;
            animation: floatText2 24s ease-in-out infinite 12s;
            opacity: 0;
        }

        .bg-text-7 {
            top: 5%;
            right: 30%;
            animation: floatText3 26s ease-in-out infinite 5s;
            opacity: 0;
        }

        .bg-text-8 {
            top: 45%;
            left: 5%;
            animation: pulse 18s ease-in-out infinite 10s;
            opacity: 0.1;
        }

        /* Contenuto sopra lo sfondo */
        .content-layer {
            position: relative;
            z-index: 1;
        }

        .gradient-text {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .product-image {
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.1);
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

            {

            {

                name: 'Jeans Straight',
                price: 79.99,
                images: [
                    'https://images.unsplash.com/photo-1542272604-787c3835535d?w=500&h=600&fit=crop',
                    'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=500&h=600&fit=crop'
                ],

            {

                price: 49.99,
                images: [
                    'https://images.unsplash.com/photo-1517438476312-10d79c077509?w=500&h=600&fit=crop',

            }
        ];

        // State globale
        let state = {
            cart: [],
            selectedCategory: 'Tutti',
            isCartOpen: false,
            showCheckout: false,
            orderComplete: false,
            zoomedProduct: null,
            zoomedImageIndex: 0,
            customerData: {
                name: '',
                email: '',
                phone: '',
                address: '',
                city: '',
                postalCode: '',
                notes: ''
            }
        };

        // Funzioni utility
        function getFilteredProducts() {
            return state.selectedCategory === 'Tutti' 
                ? PRODUCTS 
                : PRODUCTS.filter(p => p.category === state.selectedCategory);
        }

        function getTotalPrice() {
            return state.cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        }

        function getTotalItems() {
            return state.cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        function addToCart(product, size) {
            const existingItem = state.cart.find(item => item.id === product.id && item.size === size);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                state.cart.push({ ...product, size, quantity: 1 });
            }
            
            state.isCartOpen = true;
            render();
        }

        function updateQuantity(id, size, change) {
            const item = state.cart.find(item => item.id === id && item.size === size);
            if (item) {
                item.quantity = Math.max(0, item.quantity + change);
            }
            state.cart = state.cart.filter(item => item.quantity > 0);
            render();
        }

        function removeFromCart(id, size) {
            state.cart = state.cart.filter(item => !(item.id === id && item.size === size));
            render();
        }

        function setCategory(category) {
            state.selectedCategory = category;
            render();
        }

        function toggleCart() {
            state.isCartOpen = !state.isCartOpen;
            render();
        }

        function openCheckout() {
            state.showCheckout = true;
            state.isCartOpen = false;
            render();
        }

        function closeCheckout() {
            state.showCheckout = false;
            render();
        }

        function handleOrder(e) {
            e.preventDefault();
            
            console.log('Ordine:', {
                customer: state.customerData,
                items: state.cart,
                total: getTotalPrice(),
                paymentMethod: 'Contrassegno'
            });
            
            state.orderComplete = true;
            state.cart = [];
            render();
            
            setTimeout(() => {
                state.orderComplete = false;
                state.showCheckout = false;
                state.customerData = {
                    name: '',
                    email: '',
                    phone: '',
                    address: '',
                    city: '',
                    postalCode: '',
                    notes: ''
                };
                render();
            }, 5000);
        }

        function updateCustomerData(field, value) {
            state.customerData[field] = value;
        }

        function openZoom(product, imageIndex = 0) {
            state.zoomedProduct = product;
            state.zoomedImageIndex = imageIndex;
            render();
        }

        function closeZoom() {
            state.zoomedProduct = null;
            state.zoomedImageIndex = 0;
            render();
        }

        function nextZoomedImage() {
            if (state.zoomedProduct) {
                state.zoomedImageIndex = (state.zoomedImageIndex + 1) % state.zoomedProduct.images.length;
                render();
            }
        }

        function prevZoomedImage() {
            if (state.zoomedProduct) {
                state.zoomedImageIndex = state.zoomedImageIndex === 0 
                    ? state.zoomedProduct.images.length - 1 
                    : state.zoomedImageIndex - 1;
                render();
            }
        }

        function goToZoomedImage(index) {
            state.zoomedImageIndex = index;
            render();
        }

        // Componente ProductCard
        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card bg-zinc-900 rounded-xl overflow-hidden border border-pink-500/20 hover:border-pink-500/50 transition-all duration-300 hover:shadow-xl hover:shadow-pink-500/20 hover:scale-105';
            
            let currentImageIndex = 0;
            let selectedSize = product.sizes[0];
            let touchStart = 0;

            function updateImage() {
                const img = card.querySelector('.product-image');
                const badge = card.querySelector('.image-badge');
                const dots = card.querySelectorAll('.dot');
                
                if (img) {
                    img.src = product.images[currentImageIndex];
                }
                if (badge && product.images.length > 1) {
                    badge.textContent = `${currentImageIndex + 1}/${product.images.length}`;
                }
                dots.forEach((dot, i) => {
                    if (i === currentImageIndex) {
                        dot.className = 'dot w-6 h-2 rounded-full bg-pink-500 transition-all duration-300';
                    } else {
                        dot.className = 'dot w-2 h-2 rounded-full bg-white/50 hover:bg-white/80 transition-all duration-300 cursor-pointer';
                    }
                });
            }

            function nextImage() {
                currentImageIndex = (currentImageIndex + 1) % product.images.length;
                updateImage();
            }

            function prevImage() {
                currentImageIndex = currentImageIndex === 0 ? product.images.length - 1 : currentImageIndex - 1;
                updateImage();
            }

            function goToImage(index) {
                currentImageIndex = index;
                updateImage();
            }

            card.innerHTML = `
                <div class="relative overflow-hidden aspect-[3/4] cursor-pointer" data-zoom-trigger>
                    <img 
                        src="${product.images[0]}" 
                        alt="${product.name}"
                        class="product-image w-full h-full object-cover"
                    />
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent opacity-60"></div>
                    
                    <!-- Badge Zoom -->
                    <div class="absolute top-3 left-3 bg-black/70 backdrop-blur-sm text-white text-xs px-3 py-1 rounded-full font-medium flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        <i data-lucide="zoom-in" class="w-3 h-3"></i>
                        Clicca per ingrandire
                    </div>
                    
                    ${product.images.length > 1 ? `
                        <button class="prev-btn absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white p-2 rounded-full transition-all duration-300 opacity-0 group-hover:opacity-100 z-10">
                            <i data-lucide="chevron-left" class="w-5 h-5"></i>
                        </button>
                        <button class="next-btn absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/70 text-white p-2 rounded-full transition-all duration-300 opacity-0 group-hover:opacity-100 z-10">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                        
                        <div class="absolute bottom-20 left-1/2 -translate-x-1/2 flex gap-2 z-10">
                            ${product.images.map((_, i) => `
                                <button class="dot ${i === 0 ? 'w-6 h-2 rounded-full bg-pink-500' : 'w-2 h-2 rounded-full bg-white/50 hover:bg-white/80'} transition-all duration-300 cursor-pointer" data-index="${i}"></button>
                            `).join('')}
                        </div>
                        
                        <div class="image-badge absolute top-3 right-3 bg-black/70 backdrop-blur-sm text-white text-xs px-3 py-1 rounded-full font-medium">
                            1/${product.images.length}
                        </div>
                    ` : ''}
                    
                    <div class="absolute bottom-0 left-0 right-0 p-4">
                        <h3 class="text-xl font-bold text-white mb-1">${product.name}</h3>
                        <p class="text-2xl font-bold text-pink-400">€${product.price.toFixed(2)}</p>
                    </div>
                </div>
                
                <div class="p-4">
                    <div class="mb-3">
                        <label class="text-sm text-gray-400 mb-2 block">Seleziona Taglia:</label>
                        <div class="sizes-container flex gap-2 flex-wrap">
                            ${product.sizes.map(size => `
                                <button class="size-btn px-4 py-2 rounded-lg font-medium transition-all duration-300 ${size === selectedSize ? 'bg-pink-500 text-white shadow-lg shadow-pink-500/50' : 'bg-pink-500/10 text-pink-300 hover:bg-pink-500/20'}" data-size="${size}">
                                    ${size}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                    
                    <button class="add-to-cart w-full bg-gradient-to-r from-pink-500 to-pink-600 text-white py-3 rounded-lg font-bold hover:from-pink-600 hover:to-pink-700 transition-all duration-300 shadow-lg shadow-pink-500/50 hover:shadow-pink-500/70 flex items-center justify-center gap-2 hover:scale-105">
                        <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                        Aggiungi al Carrello
                    </button>
                </div>
            `;

            // Event listeners
            if (product.images.length > 1) {
                const prevBtn = card.querySelector('.prev-btn');
                const nextBtn = card.querySelector('.next-btn');
                const dots = card.querySelectorAll('.dot');
                const img = card.querySelector('.product-image');

                prevBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    prevImage();
                });

                nextBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    nextImage();
                });

                dots.forEach(dot => {
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        goToImage(parseInt(dot.dataset.index));
                    });
                });

                // Touch swipe
                img.addEventListener('touchstart', (e) => {
                    touchStart = e.touches[0].clientX;
                });

                img.addEventListener('touchend', (e) => {
                    const touchEnd = e.changedTouches[0].clientX;
                    const diff = touchStart - touchEnd;
                    
                    if (Math.abs(diff) > 50) {
                        if (diff > 0) {
                            nextImage();
                        } else {
                            prevImage();
                        }
                    }
                });
            }

            // Click to zoom
            const zoomTrigger = card.querySelector('[data-zoom-trigger]');
            zoomTrigger.addEventListener('click', (e) => {
                // Non aprire zoom se si sta cliccando sui controlli
                if (e.target.closest('.prev-btn') || 
                    e.target.closest('.next-btn') || 
                    e.target.closest('.dot')) {
                    return;
                }
                openZoom(product, currentImageIndex);
            });

            // Size selection
            card.querySelectorAll('.size-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedSize = btn.dataset.size;
                    card.querySelectorAll('.size-btn').forEach(b => {
                        b.className = 'size-btn px-4 py-2 rounded-lg font-medium transition-all duration-300 bg-pink-500/10 text-pink-300 hover:bg-pink-500/20';
                    });
                    btn.className = 'size-btn px-4 py-2 rounded-lg font-medium transition-all duration-300 bg-pink-500 text-white shadow-lg shadow-pink-500/50';
                });
            });

            // Add to cart
            card.querySelector('.add-to-cart').addEventListener('click', () => {
                addToCart(product, selectedSize);
            });

            return card;
        }

        // Render principale
        function render() {
            const app = document.getElementById('app');
            
            const totalPrice = getTotalPrice();
            const totalItems = getTotalItems();
            const filteredProducts = getFilteredProducts();

            app.innerHTML = `
                <!-- Scritte animate nello sfondo -->

                    <div class="bg-text bg-text-8">LSG2</div>
                </div>

                <div class="min-h-screen bg-black text-white content-layer">
                    <!-- Header -->
                    <header class="fixed top-0 w-full bg-black/90 backdrop-blur-lg border-b border-pink-500/20 z-50">
                        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                            <h1 class="text-3xl font-bold gradient-text">LSG2</h1>

                zoomImage.addEventListener('touchstart', (e) => {
                    if (isZoomed && e.touches.length === 1) {
                        touchStartX = e.touches[0].clientX - translateX;
                        touchStartY = e.touches[0].clientY - translateY;
                    }
                });

                zoomImage.addEventListener('touchmove', (e) => {
                    if (isZoomed && e.touches.length === 1) {
                        translateX = e.touches[0].clientX - touchStartX;
                        translateY = e.touches[0].clientY - touchStartY;
                        zoomImage.style.transform = `scale(2) translate(${translateX}px, ${translateY}px)`;
                        e.preventDefault();
                    }
                });
            }

            // Keyboard navigation
            const handleKeyPress = (e) => {
                if (state.zoomedProduct) {
                    if (e.key === 'Escape') {
                        closeZoom();
                    } else if (e.key === 'ArrowLeft') {
                        prevZoomedImage();
                    } else if (e.key === 'ArrowRight') {
                        nextZoomedImage();
                    }
                }
            };

            document.removeEventListener('keydown', handleKeyPress);
            document.addEventListener('keydown', handleKeyPress);
        }

        // Initialize
        render();
    </script>
</body>
</html>
